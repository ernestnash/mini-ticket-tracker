name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    runs-on: ubuntu-latest
    # CI-only throwaway database; local development uses the hosted database from api/.env
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3001/health
      - name: Smoke test through the web proxy
        run: |
          curl --fail --silent --retry 15 --retry-delay 2 --retry-connrefused http://localhost:3000/ -o /dev/null
          curl --fail --silent -X POST http://localhost:3000/api/tickets \
            -H "content-type: application/json" \
            -d '{"title":"CI smoke test","priority":"high"}'
          curl --fail --silent http://localhost:3000/api/tickets/stats | grep -q '"open":1'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v